name: falcon_byte
description: "Aplicación de comercio local para el Tec"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_database: ^10.5.5
  google_sign_in: ^6.2.1

  # Navegación
  go_router: ^13.0.0

  # Gestión de estado
  flutter_bloc: ^8.1.3
  provider: ^6.1.1
  equatable: ^2.0.5

  # Inyección de dependencias
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Utilidades
  dartz: ^0.10.1
  intl: ^0.18.1

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9

  # Iconos
  cupertino_icons: ^1.0.2
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true

  # assets:
  #   - images/
  #   - icons/
